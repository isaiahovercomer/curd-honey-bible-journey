<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奶酪與蜂蜜｜聖經之旅福音選讀</title>
<meta name="description" content="聖經之旅福音選讀：十五冊，每冊十八課，每課十頁圖卡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fdf8ee; --cream2:#f7ecd4; --ink:#3a2a18; --muted:#7a6550;
    --honey:#b7791f; --honey2:#d9a441; --line:#e8dcc2; --card:#fffdf6;
    --brown:#5b3f1d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;line-height:1.7}
  /* 典雅底色：奶油漸層＋淡淡蜂巢光暈，不搶文字 */
  .hero{
    background:
      radial-gradient(520px 260px at 85% 0%, rgba(217,164,65,.28), transparent 70%),
      radial-gradient(420px 240px at 8% 20%, rgba(247,236,212,.9), transparent 70%),
      linear-gradient(180deg,#fdf3d7 0%,#fdf8ee 55%,#fdf8ee 100%);
    border-bottom:1px solid var(--line);text-align:center;
    padding:56px 20px 36px}
  .hero small{letter-spacing:.35em;color:var(--honey);font-size:13px}
  .heroArt{width:180px;height:86px;margin:0 auto 2px}
  .hero h1{margin:6px 0 14px;font-family:"Noto Sans TC","Noto Serif TC",serif;font-weight:900;
    font-size:clamp(46px,12vw,78px);line-height:1.15;letter-spacing:.04em}
  .hero h1 .tchar{display:inline-block;text-shadow:0 3px 0 #fff,0 6px 14px rgba(91,63,29,.18)}
  .hero h1 .tchar:nth-child(1){color:#e8a020;transform:rotate(-4deg)}
  .hero h1 .tchar:nth-child(2){color:#d97b29;transform:rotate(3deg) translateY(3px)}
  .hero h1 .tchar:nth-child(3){color:#b7791f;transform:rotate(-2deg)}
  .hero h1 .tchar:nth-child(4){color:#f2b705;transform:rotate(4deg) translateY(2px)}
  .hero h1 .tchar:nth-child(5){color:#c98a2e;transform:rotate(-3deg)}
  .hero h2{display:inline-block;margin:0;background:#fff3d6;border:2px solid var(--honey2);
    border-radius:999px;padding:10px 24px;font-family:"Noto Sans TC",serif;font-weight:700;
    font-size:clamp(21px,5.5vw,30px);color:var(--brown);letter-spacing:.12em;
    box-shadow:0 4px 14px rgba(183,121,31,.18)}
  .hero p{margin:14px auto 0;max-width:620px;color:var(--muted);font-size:15px}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;color:var(--muted);font-size:14px}
  .volume{margin-top:16px;border:1px solid var(--line);border-left:7px solid var(--vacc,#e8dcc2);border-radius:14px;
    background:var(--vlight,#fffdf6);overflow:hidden}
  .volume>button strong{color:var(--vacc,#3a2a18)}
  .volume>button{width:100%;border:0;background:transparent;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:16px;text-align:left;font-family:inherit}
  .volume>button strong{font-size:18px}
  .volume>button span{color:var(--muted);font-size:13px;white-space:nowrap}
  .volume>button .chev{color:var(--honey);font-size:20px}
  .lessons{display:none;padding:0 12px 14px}
  .volume.open .lessons{display:block}
  .volume.open .chev{transform:rotate(180deg)}
  .lessons button{display:block;width:100%;border:1px solid var(--line);background:#fffef9;border-radius:10px;
    padding:11px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:15px;color:var(--ink);text-align:left}
  .lessons button .ltitle{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .search{width:100%;border:1px solid var(--line);border-radius:999px;background:var(--card);
    padding:12px 18px;font-family:inherit;font-size:16px;color:var(--ink);margin-top:16px}
  .lessons button:hover,.lessons button:focus{border-color:var(--honey2);outline:2px solid rgba(217,164,65,.35)}
  /* 課程頁 */
  #lessonView{display:none}
  .back{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 16px;cursor:pointer;font-family:inherit;font-size:15px}
  .lessonHead{text-align:center;margin:18px 0 6px}
  .lessonHead h2{margin:6px 0;font-size:26px}
  .lessonHead p{margin:0;color:var(--muted)}
  .modeBar{display:flex;gap:8px;justify-content:center;margin:16px 0}
  .modeBar button{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 18px;cursor:pointer;font-family:inherit;font-size:15px}
  .modeBar button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
  .pager button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);font-size:22px;cursor:pointer}
  .pager button:disabled{opacity:.35;cursor:default}
  .dots{display:flex;gap:6px;justify-content:center;margin:8px 0 18px;flex-wrap:wrap}
  .dots i{width:8px;height:8px;border-radius:50%;background:#e0d2b2;cursor:pointer}
  .dots i.on{background:var(--honey);transform:scale(1.3)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px 22px;box-shadow:0 6px 24px rgba(91,63,29,.08)}
  .card .big{font-size:52px;line-height:1;color:var(--honey2)}
  .card h3{margin:14px 0 4px;font-size:22px}
  .card p{margin:0;color:var(--muted);font-size:14px}
  /* 捲動模式：十頁上下排開，翻頁控制隱藏 */
  body.scrollMode .pager,body.scrollMode .dots{display:none}
  body.scrollMode #flipCard{display:none}
  #scrollCards{display:none}
  body.scrollMode #scrollCards{display:grid;gap:16px}
  footer{border-top:1px solid var(--line);text-align:center;padding:28px 16px 40px;color:var(--muted)}
  .social{display:flex;gap:16px;justify-content:center;margin-bottom:12px}
  .social a{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);display:flex;align-items:center;justify-content:center;text-decoration:none}
  .social svg{width:24px;height:24px;fill:var(--brown)}
  .social a:hover{border-color:var(--honey2)}
  footer p{margin:4px 0;font-size:13px}
  @media (max-width:420px){.volume.open .lessons{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
  <header class="hero">
    <small>福音選讀</small>
    <!-- 原創卡通插畫：左為帶孔的奶酪塊，右為滴著蜜的蜜罐與小蜜蜂，非書房封面複製 -->
    <svg class="heroArt" viewBox="0 0 180 86" aria-hidden="true">
      <path d="M8 62 L62 18 L62 62 Z" fill="#f7c948" stroke="#e8a020" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="34" cy="50" r="6" fill="#e8a020"/><circle cx="48" cy="38" r="4" fill="#e8a020"/><circle cx="26" cy="38" r="3" fill="#e8a020"/>
      <path d="M96 30 h52 v6 q0 26 -26 26 q-26 0 -26 -26 Z" fill="#d9a441" stroke="#b7791f" stroke-width="3"/>
      <ellipse cx="122" cy="30" rx="26" ry="7" fill="#f7c948" stroke="#b7791f" stroke-width="3"/>
      <path d="M122 37 q4 10 0 18 q-4 -8 0 -18" fill="#f2b705"/>
      <path d="M138 14 L162 34" stroke="#8a5a1f" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="156" cy="20" rx="10" ry="6" fill="#f7c948" stroke="#b7791f" stroke-width="2" transform="rotate(-32 156 20)"/>
      <g><ellipse cx="148" cy="52" rx="9" ry="5" fill="#fff" opacity=".8"/><ellipse cx="164" cy="52" rx="9" ry="5" fill="#fff" opacity=".8"/>
      <circle cx="156" cy="60" r="8" fill="#f2b705" stroke="#b7791f" stroke-width="2"/><path d="M152 56 h8 M152 62 h8" stroke="#5b3f1d" stroke-width="2"/></g>
    </svg>
    <h1><span class="tchar">奶</span><span class="tchar">酪</span><span class="tchar">與</span><span class="tchar">蜂</span><span class="tchar">蜜</span></h1>
    <h2>聖經之旅福音選讀</h2>
    <p>十五冊 · 每冊十八課 · 每課十頁圖卡<br>點開一冊，再點一課，就可以開始讀。</p>
  </header>

  <main class="wrap">
    <section id="catalog">
      <div class="note">目錄：十五冊共 270 課。點冊名展開十八課，點課名進入該課的十頁圖卡。兩連結全部 502 頁已核對完，去重後 33 課已顯示課名，其餘課名在兩連結中未出現，暫顯示「標題待補」；上方搜尋框可直接找冊名或課名。圖卡目前為版式佔位，Canva 圖卡順序確認後會直接換上真圖卡，課的順序與頁數不變。</div>
      <input class="search" id="searchInput" type="search" placeholder="搜尋冊名、課名，例如：召會、基督、施恩…" aria-label="搜尋目錄">
      <div id="volumes"></div>
    </section>

    <section id="lessonView" aria-live="polite">
      <button class="back" id="backBtn">← 回目錄</button>
      <div class="lessonHead">
        <p id="lessonVolume"></p>
        <h2 id="lessonTitle"></h2>
        <p id="lessonSub"></p>
      </div>
      <div class="modeBar" role="group" aria-label="圖卡呈現方式">
        <button id="flipBtn" class="on">翻頁</button>
        <button id="scrollBtn">捲動</button>
      </div>
      <div id="flipCard">
        <div class="card" id="cardBox"></div>
        <div class="pager">
          <button id="prevBtn" aria-label="上一頁">‹</button>
          <span id="pageNo"></span>
          <button id="nextBtn" aria-label="下一頁">›</button>
        </div>
        <div class="dots" id="dots"></div>
      </div>
      <div id="scrollCards"></div>
    </section>
  </main>

  <footer>
    <div class="social">
      <a href="https://www.facebook.com/share/1DqHUpfJ7D/" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7h2.4l.4-3h-2.8V9.1c0-.9.3-1.5 1.6-1.5h1.3V4.9c-.3 0-1.1-.1-2.1-.1-2.1 0-3.6 1.3-3.6 3.7V11H8.3v3h2.4v7h2.8z"/></svg>
      </a>
      <a href="https://www.instagram.com/tc_yp" target="_blank" rel="noopener" aria-label="Instagram tc_yp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.8A3.2 3.2 0 1 0 12 15.2 3.2 3.2 0 0 0 12 8.8zm0-2.1a5.3 5.3 0 1 1 0 10.6 5.3 5.3 0 0 1 0-10.6zm6.8-.3a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0zM12 4.2c-2.5 0-2.8 0-3.8.1-2.6.1-3.8 1.3-3.9 3.9 0 1 0 1.3 0 3.8s0 2.8.1 3.8c.1 2.6 1.3 3.8 3.9 3.9 1 0 1.3.1 3.8.1s2.8 0 3.8-.1c2.6-.1 3.8-1.3 3.9-3.9 0-1 0-1.3 0-3.8s0-2.8-.1-3.8c-.1-2.6-1.3-3.8-3.9-3.9-1 0-1.3-.1-3.8-.1z"/></svg>
      </a>
      <a href="https://www.instagram.com/tcyp.honeymilk" target="_blank" rel="noopener" aria-label="Instagram tcyp.honeymilk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.8A3.2 3.2 0 1 0 12 15.2 3.2 3.2 0 0 0 12 8.8zm0-2.1a5.3 5.3 0 1 1 0 10.6 5.3 5.3 0 0 1 0-10.6zm6.8-.3a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0zM12 4.2c-2.5 0-2.8 0-3.8.1-2.6.1-3.8 1.3-3.9 3.9 0 1 0 1.3 0 3.8s0 2.8.1 3.8c.1 2.6 1.3 3.8 3.9 3.9 1 0 1.3.1 3.8.1s2.8 0 3.8-.1c2.6-.1 3.8-1.3 3.9-3.9 0-1 0-1.3 0-3.8s0-2.8-.1-3.8c-.1-2.6-1.3-3.8-3.9-3.9-1 0-1.3-.1-3.8-.1z"/></svg>

<script>
var VOLUMES = [
  "第一冊　蒙揀選的族類","第二冊　神聖別的子民","第三冊　據有享受美地",
  "第四冊　建立神的國度","第五冊　殿與城的恢復","第六冊　愛、生命與建造",
  "第七冊　有一嬰孩為我們而生","第八冊　往榮耀裡去的路徑","第九冊　一粒麥子的繁殖與擴增",
  "第十冊　滿有榮光與卓越的職事","第十一冊　啟示的基督，建造的召會","第十二冊　至寶的基督，榮耀的盼望",
  "第十三冊　敬虔的奧祕　更美的新約","第十四冊　神聖的供備　生命的交通","第十五冊　終極的顯出－新耶路撒冷"
];
/* 已核對範圍的課名（Canva 前段核對結果）；其餘課名待後段核對後補上。鍵為「冊序-課號」，冊序從 0 起算。 */
var TITLES = {
  "10-15": "基督生機身體內在的建造", "10-17": "極大的奧秘－基督與召會",
  "11-1": "推廣福音的交通", "11-3": "以基督為我們的榜樣", "11-5": "以基督為至寶 為我們的義",
  "11-7": "以基督為我們的美德", "11-9": "歌羅西書簡介及引言", "11-11": "神的管家職分",
  "11-13": "一切影兒的實體", "11-14": "基督是我們的生命", "11-15": "新人的成分",
  "11-16": "與基督聯合的生活（一）", "11-17": "與基督聯合的生活(二)", "11-18": "結語－新人的生活",
  "12-1": "為着召會生活之聖別生活的結構與起源", "12-2": "為着召會生活之聖別生活的撫育與堅固",
  "12-3": "為着召會生活之聖別生活的勸勉、盼望、儆醒與謹守", "12-4": "與神的工作合作",
  "12-5": "為着召會生活之聖別生活的鼓勵與改正", "12-6": "神的經綸與不同的教訓相對",
  "12-7": "召會的功用", "12-8": "各面的囑咐", "12-9": "對召會敗落的豫防劑",
  "12-10": "召會秩序的維持", "12-11": "基督超越天使", "12-12": "元帥、大祭司、使徒、神家的建設者",
  "12-13": "來到施恩的寶座前", "12-14": "竭力前進達到成熟", "12-15": "君尊、神聖的大祭司 和更美的新約",
  "12-16": "更美的祭物和更美的血，同更大、更全備的帳幕",
  "12-17": "信心的歷史和見證人", "12-18": "奔跑賽程，仰望信心的創始者與成終者",
  "13-1": "基督徒實行的完全"
};
/* 完整核對中頁數未完整的課，目錄上如實標註，不宣稱為完整十頁。 */
var INCOMPLETE = {"10-17": true};
/* 同課有兩個完整版本的課，目錄上如實標註。 */
var TWO_VERSIONS = {"12-9": true};
function lessonTitle(vi, li){
  return TITLES[vi + "-" + li] || "";
}
/* 十五冊各自的色調（主題相關的柔和色系，非複製書封圖案；每冊左邊色條與標題色皆不同） */
var VOLUME_COLORS = [
  {a:"#5a7d4f", l:"#eaf2e6"}, {a:"#9a6b2f", l:"#f7ecd8"}, {a:"#7a8a3a", l:"#eef2dd"},
  {a:"#6b5a8a", l:"#edeaf4"}, {a:"#4f7a8a", l:"#e4eef2"}, {a:"#a67c88", l:"#f5e9ec"},
  {a:"#4a7fb5", l:"#e3edf7"}, {a:"#b7791f", l:"#f9ecd0"}, {a:"#8a7a2a", l:"#f3eed6"},
  {a:"#a85a4e", l:"#f6e6e2"}, {a:"#357a78", l:"#e2efee"}, {a:"#6f6a9e", l:"#e9e7f2"},
  {a:"#2f6da3", l:"#e2edf6"}, {a:"#5f7d5f", l:"#e6efe6"}, {a:"#b08a3e", l:"#f6ecd4"}
];
var volumesEl = document.getElementById('volumes');
VOLUMES.forEach(function(title, vi){
  var div = document.createElement('div');
  div.className = 'volume';
  div.style.setProperty('--vacc', VOLUME_COLORS[vi].a);
  div.style.setProperty('--vlight', VOLUME_COLORS[vi].l);
  var btn = document.createElement('button');
  btn.innerHTML = '<strong>' + title + '</strong><span>十八課 <span class="chev">▾</span></span>';
  btn.setAttribute('aria-expanded','false');
  var lessons = document.createElement('div');
  lessons.className = 'lessons';
  for (var li = 1; li <= 18; li++){
    (function(l){
      var b = document.createElement('button');
      var t = lessonTitle(vi, l);
      b.innerHTML = '<strong>第' + l + '課</strong><span class="ltitle">' +
        (t ? t + (INCOMPLETE[vi + "-" + l] ? '（頁數未完整）' : '') + (TWO_VERSIONS[vi + "-" + l] ? '（兩個版本）' : '') : '標題待補') + '</span>';
      b.dataset.search = (title + ' 第' + l + '課 ' + t).toLowerCase();
      b.onclick = function(){ openLesson(vi, l); };
      lessons.appendChild(b);
    })(li);
  }
  btn.onclick = function(){
    var open = div.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  div.appendChild(btn); div.appendChild(lessons); volumesEl.appendChild(div);
});

var curV = 0, curL = 1, curP = 1, mode = 'flip';
function cardHTML(v, l, p){
  return '<div class="big">✦</div><h3>第' + p + '頁</h3>' +
    '<p>' + VOLUMES[v] + ' · 第' + l + '課<br>圖卡待置入（Canva 順序確認後換上）</p>';
}
function render(){
  document.getElementById('lessonVolume').textContent = VOLUMES[curV];
  var lt = lessonTitle(curV, curL);
  document.getElementById('lessonTitle').textContent = '第' + curL + '課' + (lt ? '　' + lt : '');
  document.getElementById('lessonSub').textContent = '共十頁 · 翻頁或捲動皆可閱讀';
  document.getElementById('cardBox').innerHTML = cardHTML(curV, curL, curP);
  document.getElementById('pageNo').textContent = curP + ' / 10';
  document.getElementById('prevBtn').disabled = curP <= 1;
  document.getElementById('nextBtn').disabled = curP >= 10;
  var dots = document.getElementById('dots'); dots.innerHTML = '';
  for (var i = 1; i <= 10; i++){
    (function(p){
      var d = document.createElement('i');
      if (p === curP) d.className = 'on';
      d.onclick = function(){ curP = p; render(); };
      dots.appendChild(d);
    })(i);
  }
  var sc = document.getElementById('scrollCards'); sc.innerHTML = '';
  for (var j = 1; j <= 10; j++){
    var c = document.createElement('div'); c.className = 'card';
    c.innerHTML = cardHTML(curV, curL, j); sc.appendChild(c);
  }
}
function setMode(m){
  mode = m;
  document.body.classList.toggle('scrollMode', m === 'scroll');
  document.getElementById('flipBtn').className = m === 'flip' ? 'on' : '';
  document.getElementById('scrollBtn').className = m === 'scroll' ? 'on' : '';
}
function openLesson(v, l){
  curV = v; curL = l; curP = 1; setMode('flip');
  document.getElementById('catalog').style.display = 'none';
  document.getElementById('lessonView').style.display = 'block';
  render(); window.scrollTo(0, 0);
  history.replaceState(null, '', '#v' + (v+1) + '-l' + l);
}
document.getElementById('searchInput').addEventListener('input', function(e){
  var q = e.target.value.trim().toLowerCase();
  var vols = volumesEl.children;
  for (var i = 0; i < vols.length; i++){
    var v = vols[i];
    if (!q){ v.style.display = ''; continue; }
    var btns = v.querySelectorAll('.lessons button');
    var any = false;
    for (var j = 0; j < btns.length; j++){
      var show = btns[j].dataset.search.indexOf(q) >= 0;
      btns[j].style.display = show ? '' : 'none';
      if (show) any = true;
    }
    v.style.display = any ? '' : 'none';
    if (any) v.classList.add('open');
  }
});
document.getElementById('backBtn').onclick = function(){
  document.getElementById('lessonView').style.display = 'none';
  document.getElementById('catalog').style.display = 'block';
  history.replaceState(null, '', '#'); window.scrollTo(0, 0);
};
document.getElementById('prevBtn').onclick = function(){ if (curP > 1){ curP--; render(); } };
document.getElementById('nextBtn').onclick = function(){ if (curP < 10){ curP++; render(); } };
document.getElementById('flipBtn').onclick = function(){ setMode('flip'); };
document.getElementById('scrollBtn').onclick = function(){ setMode('scroll'); };
document.addEventListener('keydown', function(e){
  if (document.getElementById('lessonView').style.display !== 'block' || mode !== 'flip') return;
  if (e.key === 'ArrowLeft' && curP > 1){ curP--; render(); }
  if (e.key === 'ArrowRight' && curP < 10){ curP++; render(); }
});
var tx = 0;
document.getElementById('flipCard').addEventListener('touchstart', function(e){ tx = e.changedTouches[0].clientX; }, {passive:true});
document.getElementById('flipCard').addEventListener('touchend', function(e){
  if (mode !== 'flip') return;
  var dx = e.changedTouches[0].clientX - tx;
  if (dx < -40 && curP < 10){ curP++; render(); }
  if (dx > 40 && curP > 1){ curP--; render(); }
}, {passive:true});
</script>
</body>
</html>
